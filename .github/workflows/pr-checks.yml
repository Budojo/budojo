name: PR Quality Gates

on:
  pull_request:
    # Every PR targeting a protected branch must satisfy the required status
    # checks. Both `main` (stable) and `develop` (beta) are protected by the
    # rulesets in `.github/rulesets/`, so both need CI to run here. Without
    # this, PRs from develop → main would never emit the required contexts
    # and would stay blocked indefinitely.
    branches: [main, develop]

# Lock the GITHUB_TOKEN down to read-only on every job in this workflow
# (CVE-2026-45793 defence-in-depth — see graycoreio/github-actions-magento2
# discussion #261). The PHP jobs below run `shivammathur/setup-php` which
# pipes the workflow token into `COMPOSER_AUTH`; a future regression of
# the Composer-validator-leak bug, OR any other downstream tool that
# echoes credentials into stderr, would expose a token whose scope is
# capped at read-only. CI jobs here only read the repo (clone, install,
# test, lint) — none of them push commits, create issues, or comment on
# PRs, so locking to `contents: read` strips every write capability with
# zero functional cost.
permissions:
  contents: read

jobs:

  # ── Change detection ───────────────────────────────────────────────
  # Gate the expensive steps below by which area of the monorepo the PR
  # actually touches — WITHOUT skipping whole jobs. The develop / main
  # rulesets require these job contexts; a skipped job never reports its
  # context, so the PR would block forever (same constraint the Cypress
  # aggregator works around). So every gate job still runs and reports
  # green; its costly steps are guarded by these outputs and no-op when
  # the area is untouched. A docs-only PR now finishes in seconds instead
  # of saturating the 4 self-hosted runners for ~5 min. Any change to this
  # workflow file re-runs every area (fail-safe — see each filter below).
  changes:
    name: "🧭 Detect changed areas"
    runs-on: [self-hosted, budojo]
    # paths-filter has no checkout, so it lists changed files via the PR
    # "list files" API — which needs `pull-requests: read` on top of the
    # workflow-wide `contents: read` lockdown. Job-level permissions replace
    # (not merge with) the workflow default, so restate `contents: read` too.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/pr-checks.yml'
            client:
              - 'client/**'
              - '.github/workflows/pr-checks.yml'
            api:
              - 'docs/api/**'
              - '.github/workflows/pr-checks.yml'
            worker:
              - 'worker/**'
              - '.github/workflows/pr-checks.yml'

  phpstan:
    name: "🔬 PHPStan (level 9)"
    runs-on: [self-hosted, budojo]
    needs: changes
    # Temporary container override during GHA spending-limit block (#758).
    # `shivammathur/setup-php@v2` only supports Debian/Ubuntu hosts;
    # self-hosted runner runs on Fedora 44, so PHP jobs are wrapped in an
    # Ubuntu container so the setup action's apt-based install path works.
    # Revert this file when GitHub-hosted is back in budget.
    container:
      image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        if: needs.changes.outputs.server == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_sqlite, mbstring, bcmath, gd, zip, intl
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        if: needs.changes.outputs.server == 'true'
        uses: actions/cache@v4
        with:
          path: server/vendor
          key: composer-${{ hashFiles('server/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        if: needs.changes.outputs.server == 'true'
        run: composer install --no-interaction --prefer-dist --no-scripts
        working-directory: server

      - name: Run PHPStan
        if: needs.changes.outputs.server == 'true'
        run: vendor/bin/phpstan analyse --no-progress --error-format=github
        working-directory: server

      - name: Restore workspace ownership for host runner cleanup
        # Container ran as root and wrote files to the mounted workspace.
        # The next non-container job runs as the host user (uid 1000) and
        # cannot rm root-owned files (actions/checkout's auto-clean step
        # fails with EACCES). Reset before exiting. Temporary workaround
        # for #758; revert alongside the rest of this file.
        if: always()
        # $GITHUB_WORKSPACE (env var) is the in-container path; the
        # ${{ github.workspace }} expression expands to the host path which
        # doesn't exist inside the container. Both maps to the same bind
        # mount, so chown via the in-container path still affects host
        # ownership.
        run: chown -R 1000:1000 "$GITHUB_WORKSPACE" 2>/dev/null || true

  pest:
    name: "🧪 PEST Tests"
    runs-on: [self-hosted, budojo]
    needs: changes
    container:
      image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        if: needs.changes.outputs.server == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_sqlite, mbstring, bcmath, gd, zip, intl
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer dependencies
        if: needs.changes.outputs.server == 'true'
        uses: actions/cache@v4
        with:
          path: server/vendor
          key: composer-${{ hashFiles('server/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        if: needs.changes.outputs.server == 'true'
        run: composer install --no-interaction --prefer-dist
        working-directory: server

      - name: Copy .env for testing
        if: needs.changes.outputs.server == 'true'
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
        working-directory: server

      - name: Generate app key
        if: needs.changes.outputs.server == 'true'
        run: php artisan key:generate --ansi
        working-directory: server

      - name: Run PEST (parallel, with coverage)
        if: needs.changes.outputs.server == 'true'
        run: vendor/bin/pest --parallel --coverage
        working-directory: server

      - name: Restore workspace ownership for host runner cleanup
        if: always()
        # $GITHUB_WORKSPACE (env var) is the in-container path; the
        # ${{ github.workspace }} expression expands to the host path which
        # doesn't exist inside the container. Both maps to the same bind
        # mount, so chown via the in-container path still affects host
        # ownership.
        run: chown -R 1000:1000 "$GITHUB_WORKSPACE" 2>/dev/null || true

  php-cs-fixer:
    name: "🎨 PHP CS Fixer (dry-run)"
    runs-on: [self-hosted, budojo]
    needs: changes
    container:
      image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        if: needs.changes.outputs.server == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        if: needs.changes.outputs.server == 'true'
        uses: actions/cache@v4
        with:
          path: server/vendor
          key: composer-${{ hashFiles('server/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        if: needs.changes.outputs.server == 'true'
        run: composer install --no-interaction --prefer-dist --no-scripts
        working-directory: server

      - name: Run PHP CS Fixer (dry-run)
        if: needs.changes.outputs.server == 'true'
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --ansi --show-progress=none
        working-directory: server

      - name: Restore workspace ownership for host runner cleanup
        if: always()
        # $GITHUB_WORKSPACE (env var) is the in-container path; the
        # ${{ github.workspace }} expression expands to the host path which
        # doesn't exist inside the container. Both maps to the same bind
        # mount, so chown via the in-container path still affects host
        # ownership.
        run: chown -R 1000:1000 "$GITHUB_WORKSPACE" 2>/dev/null || true

  angular-test:
    name: "🧪 Angular Tests (Vitest)"
    runs-on: [self-hosted, budojo]
    needs: changes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.client == 'true'
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.client == 'true'
        run: npm ci
        working-directory: client

      - name: Run Angular tests
        if: needs.changes.outputs.client == 'true'
        run: npm test -- --watch=false
        working-directory: client

  angular-lint:
    name: "🔍 Angular Lint (ESLint)"
    runs-on: [self-hosted, budojo]
    needs: changes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.client == 'true'
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.client == 'true'
        run: npm ci
        working-directory: client

      - name: Run ESLint
        if: needs.changes.outputs.client == 'true'
        run: npm run lint
        working-directory: client

  angular-stylelint:
    # Non-blocking warning surface for SCSS hygiene (#978).
    # Today the rule we enforce is the 8dp grid (multiples of 0.5rem on
    # padding / margin / gap). Pre-existing violations land as `warning`,
    # not `error`, so the gate stays green while we drain the backlog in
    # follow-up sweep PRs. New violations show up in PR diffs so reviewers
    # (human + Claude) can push back proactively.
    name: "🎨 SCSS Lint (stylelint, 8dp grid)"
    runs-on: [self-hosted, budojo]
    needs: changes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.client == 'true'
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.client == 'true'
        run: npm ci
        working-directory: client

      - name: Run stylelint
        if: needs.changes.outputs.client == 'true'
        run: npm run lint:scss
        working-directory: client

  angular-format:
    name: "✨ Angular Format (Prettier)"
    runs-on: [self-hosted, budojo]
    needs: changes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.client == 'true'
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.client == 'true'
        run: npm ci
        working-directory: client

      - name: Check formatting
        if: needs.changes.outputs.client == 'true'
        run: npm run format:check
        working-directory: client

  # Cypress E2E — sharded on **GitHub-hosted** runners (#1193). The
  # self-hosted Slimbook lacks the headroom to run `ng serve` alongside the
  # PHP/Angular gates without saturating disk (#758 + four reproductions on
  # the parked #1194: ECONNREFUSED on :4200, plus load-induced Vitest
  # flakes). Moving JUST Cypress to `ubuntu-latest` gives each shard a
  # fresh, clean disk; the cheap PHP/Angular gates stay self-hosted. With
  # the `client` path-filter (#1192) we only burn GHA minutes when the SPA
  # actually changes — comfortably inside the free tier.
  #
  # Manual matrix sharding (no Cypress Cloud / no $CYPRESS_RECORD_KEY) —
  # each shard runs a deterministic subset of `cypress/e2e/*.cy.ts` via a
  # sort-then-modulo split (i+1) % N == shard % N. Closes #295. The
  # required-status-check name (`🎭 Cypress E2E`) is preserved by the
  # aggregator below, so the develop / main rulesets need no edits.
  cypress-e2e-shard:
    name: "Cypress E2E shard ${{ matrix.shard }}"
    runs-on: ubuntu-latest
    needs: changes
    # Only run when the SPA changed (path-filter from #1192). When `client`
    # is untouched the shards skip and the aggregator passes on `skipped`.
    if: needs.changes.outputs.client == 'true'
    strategy:
      # Run all shards even if one fails — full visibility on which
      # specs broke per shard. Sequential failures would mask up to
      # N-1 other shards' results.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      TOTAL_SHARDS: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Compute spec list for this shard
        id: specs
        working-directory: client
        # `mapfile` + process substitution `<(…)` are bash-only; `ubuntu-latest`
        # defaults to bash already, but the explicit `shell: bash` keeps this
        # robust to a future runner image change.
        shell: bash
        run: |
          # Sort-then-modulo split. Shard i (1-indexed) gets every
          # (TOTAL_SHARDS)-th spec starting at i. Stable across renames /
          # additions modulo a one-slot shift in the bucket of the new
          # entry.
          #
          # `find` instead of `ls *.cy.ts` because GitHub Actions' default
          # shell carries `-eo pipefail` — an unmatched glob makes `ls`
          # fail with status 1 and aborts the step before the empty-shard
          # branch below ever runs. `find` returns 0 on no matches, so the
          # zero-spec fallback stays reachable.
          mapfile -t SPECS < <(find cypress/e2e -maxdepth 1 -name '*.cy.ts' -type f | sort)
          SHARD_SPECS=()
          for i in "${!SPECS[@]}"; do
            if [ $(( (i + 1) % TOTAL_SHARDS )) -eq $(( ${{ matrix.shard }} % TOTAL_SHARDS )) ]; then
              SHARD_SPECS+=("${SPECS[$i]}")
            fi
          done
          # Comma-separated for cypress's --spec arg. Empty fallback
          # is `cypress/e2e/__none__.cy.ts` which cypress treats as a
          # no-match; the shard step succeeds with 0 specs. Defensive
          # only — at TOTAL_SHARDS=4 / 14 specs every shard gets ≥3.
          if [ ${#SHARD_SPECS[@]} -eq 0 ]; then
            echo "spec=cypress/e2e/__none__.cy.ts" >> "$GITHUB_OUTPUT"
          else
            echo "spec=$(IFS=,; echo "${SHARD_SPECS[*]}")" >> "$GITHUB_OUTPUT"
          fi
          echo "Shard ${{ matrix.shard }} runs:"
          printf '  %s\n' "${SHARD_SPECS[@]}"

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          working-directory: client
          # Real `ng serve` — the exact environment the specs target (dev
          # proxy included). On `ubuntu-latest` each shard gets a clean,
          # fresh disk so the cold-start binds quickly; no inter-shard
          # contention (each shard is a fresh VM).
          start: npm run start
          wait-on: "http://localhost:4200"
          # Generous timeout: covers `npm ci` warming + ng serve cold compile.
          wait-on-timeout: 180
          browser: chrome
          spec: ${{ steps.specs.outputs.spec }}

  cypress-e2e:
    # Aggregator — preserves the `🎭 Cypress E2E` required-status-check
    # name so the develop / main rulesets don't need editing. Passes when
    # the shards succeeded OR were skipped (client untouched); fails if any
    # shard failed. `needs.<job>.result` rolls up the matrix outcome.
    # Stays self-hosted — it's a 5-second check, no point burning GHA mins.
    name: "🎭 Cypress E2E"
    needs: [cypress-e2e-shard]
    if: always()
    runs-on: [self-hosted, budojo]
    steps:
      - name: Verify Cypress shards
        run: |
          result="${{ needs.cypress-e2e-shard.result }}"
          echo "cypress-e2e-shard result: $result"
          # 'skipped' = client/** untouched (path-filter from #1192) → there
          # was nothing to E2E-test. 'success' = all shards green. Anything
          # else (failure / cancelled) blocks the PR.
          if [ "$result" = "success" ] || [ "$result" = "skipped" ]; then
            exit 0
          fi
          echo "::error::A Cypress shard did not pass (result: $result)."
          exit 1

  openapi-lint:
    name: "🔬 OpenAPI Lint (Spectral)"
    runs-on: [self-hosted, budojo]
    needs: changes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.api == 'true'
        with:
          node-version: "22"

      - name: Run Spectral
        if: needs.changes.outputs.api == 'true'
        run: npx -y @stoplight/spectral-cli@6 lint docs/api/v1.yaml

  worker-test:
    # Vitest specs for the Cloudflare worker that fronts the SPA's
    # static-asset binding (`worker/index.js` — see #382). The
    # `client/` and `server/` test jobs above don't reach this code,
    # so without a dedicated job the navigation-vs-asset routing
    # logic ships untested. Lives at the repo root because the
    # worker is its own deploy artefact, not part of the Angular app.
    name: "🧪 Worker Tests (Vitest)"
    runs-on: [self-hosted, budojo]
    needs: changes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.worker == 'true'
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.worker == 'true'
        run: npm ci
        working-directory: worker

      - name: Run worker tests
        if: needs.changes.outputs.worker == 'true'
        run: npm test
        working-directory: worker
