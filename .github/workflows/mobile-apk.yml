name: Mobile APK

# Budojo for the phone as a signed Android APK (#2027, #2034, M12 #2026): the
# SPA's `mobile` build and Budojo's own server, packed by Capacitor and signed
# with the release key.
#
# - **On a pull request** it is a workflow artifact the owner sideloads to test.
#   It runs on every client and server change: the phone runs the whole SPA and
#   the whole server, so a change anywhere in either can break it (#2043 review).
# - **From release.yml** (`workflow_call` with a `tag`, #2040) it builds that tag
#   as `Budojo-Android-X.Y.Z.apk` and opens it on the emulator; release.yml then
#   attaches it to the release, beside the Windows installer: every beta on
#   develop, every stable on main.
on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'client/**'
      - 'server/**'
      - '.github/workflows/mobile-apk.yml'
  # By hand: a test build of the branch, or with a tag, that tag's APK as a
  # release would build it (not attached).
  workflow_dispatch:
    inputs:
      tag:
        description: A release tag to build (v2.78.0); blank builds the branch.
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      tag:
        description: The release tag to build and attach the APK to (v2.78.0, v2.78.0-beta.3).
        type: string
        required: true

# Read-only token, as in pr-checks.yml: these jobs decode the release key, so
# they get nothing they do not need. release.yml attaches the APK itself.
permissions:
  contents: read

concurrency:
  # A release's APK is never cancelled by the next push: it is per tag.
  group: mobile-apk-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ !inputs.tag }}

jobs:
  # PHP for the phone, from source (#2044): static-php-cli inside Alpine on an
  # arm64 runner, so the binary is musl and fully static. Cached under the
  # recipe's hash, so it rebuilds only when mobile/php/ changes.
  php:
    name: 🐘 PHP for Android (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/cache@v4
        id: cache
        with:
          path: mobile/php/out
          key: php-android-${{ hashFiles('mobile/php/recipe.env', 'mobile/php/build.sh', 'mobile/php/*.php') }}

      # The cache is reachable from develop and from a PR into it; a PR
      # stacked on another branch rebuilds (#2081). static-php-cli then asks
      # GitHub's API for every source's releases, and anonymously a shared
      # runner's address runs out of calls (403). The run's own token lifts it.
      - name: Build PHP from source in Alpine
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker run --rm -e GITHUB_TOKEN -v "$PWD:/work" -w /work alpine:3.21 sh mobile/php/build.sh /work/mobile/php/out

      # Android's app seccomp policy kills a process that calls accept (it allows
      # accept4). Reproduce that here, so a PHP that would die on a phone at its
      # first connection never reaches an APK: the binary must serve a page
      # under a policy that kills on accept. Runs on cached builds too.
      - name: Serve a page under a seccomp policy that kills on accept, as Android does
        run: |
          cat > "$RUNNER_TEMP/no-accept.json" <<'JSON'
          {"defaultAction": "SCMP_ACT_ALLOW", "architectures": ["SCMP_ARCH_AARCH64"],
           "syscalls": [{"names": ["accept"], "action": "SCMP_ACT_KILL_PROCESS"}]}
          JSON
          docker run --rm --security-opt seccomp="$RUNNER_TEMP/no-accept.json" \
            -v "$PWD/mobile/php/out:/php:ro" alpine:3.21 sh -c '
              mkdir -p /srv && printf "<?php echo \"pong\";" > /srv/ping.php
              /php/php -S 127.0.0.1:8080 -t /srv > /tmp/server.log 2>&1 &
              sleep 1
              answer=$(wget -qO- http://127.0.0.1:8080/ping.php || true)
              cat /tmp/server.log
              [ "$answer" = "pong" ] || { echo "::error::PHP did not serve under the no-accept policy (got: $answer)"; exit 1; }
              echo "served under the no-accept policy: $answer"'

      - uses: actions/upload-artifact@v4
        with:
          name: php-android-arm64
          path: mobile/php/out/php
          retention-days: 7

  apk:
    name: 📱 Android APK
    needs: php
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version_name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      # The name is the tag's, or 0.0.<run> for a test build. **The code is the
      # commit's time, in minutes since 2026:** one order for test builds,
      # betas and releases, so any newer build installs over any older one.
      # Android refuses a lower code, and a code from the semver would put a
      # release above every test APK after it (#2040).
      - name: Name the version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then NAME="${TAG#v}"; else NAME="0.0.${GITHUB_RUN_NUMBER}"; fi
          CODE=$(( ( $(git log -1 --format=%ct) - 1767225600 ) / 60 ))
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Version $NAME, code $CODE"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            mobile/package-lock.json

      - name: Install the client
        working-directory: client
        run: npm ci

      # Budojo itself, in its phone configuration (#2034). The prebuild stamps
      # BUDOJO_VERSION into the sidebar's version, as the desktop installer does.
      - name: Build the app for the phone
        working-directory: client
        env:
          BUDOJO_VERSION: ${{ env.VERSION_NAME }}
        run: npm run build -- --configuration mobile

      - name: Install Capacitor
        working-directory: mobile
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: php-android-arm64
          path: ${{ runner.temp }}/php

      # The one place Android lets an app execute a file is its native library
      # directory, so the binary travels as a library (#2044).
      - name: Put PHP where Android can execute it
        run: |
          mkdir -p mobile/android/app/src/main/jniLibs/arm64-v8a
          install -m 0755 "$RUNNER_TEMP/php/php" mobile/android/app/src/main/jniLibs/arm64-v8a/libphp.so

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: fileinfo, pdo, pdo_sqlite, mbstring, bcmath, gd, zip, intl, sodium
          tools: composer:v2

      - name: Pack the server
        run: ./mobile/php/bundle-server.sh mobile/android/app/src/main/assets

      - name: Copy the web build into the Android project
        working-directory: mobile
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # No key, no APK. A build signed with anything else could never be
      # installed over the app already on a phone, so it is refused, not faked.
      - name: Decode the release key
        env:
          KEYSTORE_B64: ${{ secrets.BUDOJO_ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::BUDOJO_ANDROID_KEYSTORE_B64 is not set: refusing to build an APK that could never update the installed app"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/budojo-release.p12"
          echo "BUDOJO_ANDROID_KEYSTORE=$RUNNER_TEMP/budojo-release.p12" >> "$GITHUB_ENV"

      - name: Build the signed APK
        working-directory: mobile/android
        env:
          BUDOJO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BUDOJO_ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PbudojoVersionCode="$VERSION_CODE" -PbudojoVersionName="$VERSION_NAME"

      # The certificate is pinned: a secret replaced by mistake would sign an
      # APK that installs on a fresh phone and never updates an existing one.
      - name: Check the APK carries the Budojo release key
        working-directory: mobile/android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::no signed app-release.apk was produced"
            ls app/build/outputs/apk/release || true
            exit 1
          fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          if ! grep -qi 'SHA-256 digest: 9b2b6953dccdb46ed7c5ddbdf4b03a3f42f62dfe5adebf9b1ab34f582fe25c5e' "$RUNNER_TEMP/certs.txt"; then
            echo "::error::the APK is not signed with the Budojo release key"
            exit 1
          fi
          cp "$APK" "$RUNNER_TEMP/Budojo-Android-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Budojo-Android-${{ env.VERSION_NAME }}
          path: ${{ runner.temp }}/Budojo-Android-${{ env.VERSION_NAME }}.apk
          retention-days: 14

  # The owner's ask (#2079): each APK meets a real Android before it meets
  # them. An emulator shaped like a common phone (Android 14, a Galaxy
  # A-class 1080x2340 screen) installs it, opens it, and photographs each
  # screen it reaches. The photos are this run's artifact.
  emulator:
    name: 📱 On an Android emulator
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VERSION_NAME: ${{ needs.apk.outputs.version_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: Budojo-Android-${{ env.VERSION_NAME }}
          path: ${{ runner.temp }}/apk

      - name: Let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot a Galaxy A-class phone, Android 14
        run: mobile/emulator/boot.sh

      - name: Open the app and photograph each screen
        run: mobile/emulator/smoke.sh "$RUNNER_TEMP/apk/Budojo-Android-${VERSION_NAME}.apk" "$RUNNER_TEMP/shots"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Budojo-Android-${{ env.VERSION_NAME }}-emulator
          path: ${{ runner.temp }}/shots
          retention-days: 14
