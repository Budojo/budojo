name: 🚀 Auto-open release on Claude reviewer change

# Closes #823 — process safety net for the "workflow validation guard"
# gotcha (.claude/gotchas.md § Claude reviewer). When the Claude reviewer
# config (workflow YAML or subagent prompt) merges to develop, the action
# silently refuses to run on every subsequent PR until that change reaches
# main. We've hit the gap twice (v2.18.4 bootstrap, v2.18.5 sticky-comment).
#
# This workflow watches develop for pushes touching the reviewer config and
# auto-opens a DRAFT develop → main PR so the next required step ("ship
# the workflow change to main") is impossible to forget — it shows up as
# an open PR in the queue.
#
# The PR stays DRAFT on purpose: the release flow still needs a paired
# chore/whats-new-vX.Y.Z to satisfy the vitest version pin, and the
# auto-closes block has to aggregate the leaf-issue references from
# `main..develop`. The maintainer fills those in and marks the PR ready;
# auto-merge fires when CI green. The automation removes the "remember"
# step, not the body-discipline step.

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/pr-claude-review.yml'
      - '.claude/agents/pr-code-reviewer.md'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-release-on-reviewer-change
  cancel-in-progress: false

jobs:
  open-release:
    runs-on: [self-hosted, budojo]
    steps:
      - name: Check for an existing open develop → main PR
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use --search instead of --base because gh CLI filters by base
          # branch loosely on some versions. Explicit search query is the
          # safest cross-version match: "open PR from develop into main".
          existing=$(gh pr list \
            --repo Budojo/budojo \
            --state open \
            --search "is:open is:pr base:main head:develop" \
            --json number \
            --jq '.[0].number // ""')
          echo "number=$existing" >> "$GITHUB_OUTPUT"
          if [ -n "$existing" ]; then
            echo "Existing release PR #$existing — will comment on it instead of opening a new one."
          else
            echo "No open develop → main PR — will open a draft."
          fi

      - name: Comment on the existing release PR
        if: steps.existing.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.existing.outputs.number }}
          SHA: ${{ github.sha }}
        run: |
          gh pr comment "$PR" --repo Budojo/budojo --body "🤖 \`auto-release-on-reviewer-change\` reminder: another Claude-reviewer config change just landed on develop (\`$SHA\`). This release PR is the one that ships it to main. No action needed — just ready it when the paired whats-new chore is merged."

      - name: Open a draft release PR
        if: steps.existing.outputs.number == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          gh pr create \
            --repo Budojo/budojo \
            --base main --head develop \
            --draft \
            --title "release: ship pending Claude reviewer config changes to main" \
            --body "$(cat <<'EOF'
          ## What

          Auto-opened by `.github/workflows/auto-release-on-reviewer-change.yml` (#823) — a Claude-reviewer config change just merged to develop and the workflow validation guard now refuses to run the reviewer on every subsequent PR until this PR brings the change to main.

          ## Why a DRAFT

          Two release-PR preconditions still need a human:

          1. **Paired whats-new chore.** Cut `chore/whats-new-v{X.Y.Z}` with the user-facing changelog entry + the typed `Release[]` array entry + the vitest version pin bump. Merge it (chore-skip from review, fast). Without it the vitest spec `renders every shipped release in newest-first order` fails CI on the release PR.
          2. **Auto-closes block.** Walk `main..develop` for squash commits, fetch each `(#PR_N)` reference's body, aggregate every `Closes #M` / `Fixes #M` / `Resolves #M` into a single `## Auto-closes` section in THIS PR's body. GitHub auto-closes those issues the moment this PR merges to main (the default branch).

          Once both land, mark this PR Ready for review. Auto-merge with `--merge` (NOT squash — memory `project_release_merge_style`); semantic-release tags the new stable version + opens the sweep PR back into develop.

          ## Reference

          - Static gotcha: `.claude/gotchas.md` § Claude reviewer (workflow validation guard)
          - Operational memory: `feedback_workflow_changes_need_immediate_release`
          - Closes #823 (this PR's existence is itself the proof the automation works)
          EOF
          )"
