<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Budojo</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Budojo — BJJ gym management. Track athletes, documents, and attendance."
    />
    <meta name="theme-color" content="#0a0a0b" />

    <!-- PWA manifest (icons, name, theme, start_url). -->
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- Favicons + installable icons (#183).
         Default is the WHITE-stroke variant — modern browsers (Chrome, Brave,
         Edge, Firefox) ship with a dark tab strip even when the OS is in
         light mode, and a black logo disappears against it. The dark-stroke
         variant is offered conditionally for OS-light pinned-tab contexts
         where the tab background is white; UA support for `media` on
         `<link rel="icon">` is partial (Safari is incomplete), so when the
         media query is ignored we still fall back to the white variant —
         which is the more visible state across our actual user base.
         Legacy browsers fall through to the ICO. The 192 PNG stays as a
         Chromium downscale hint, and apple-touch-icon stays for iOS
         "Add to Home Screen". -->
    <link rel="icon" type="image/svg+xml" href="favicon-light.svg" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <!-- iOS PWA meta: capable + status-bar style. Deprecated in name but still
         honoured by Safari on iOS 16.4+, which is our PWA floor. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Budojo" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      Dark theme, before first paint (#1793).

      Angular bootstraps long after the browser paints, so `ThemeService`
      cannot be the one to put the class on <html> — by the time it runs the
      user has already seen a white flash. This is the standard, and the only
      working, answer: a few lines inline in <head>, reading the same
      `budojoTheme` key the service owns.

      It is deliberately dumb. It decides ONE thing — the class and the
      matching `color-scheme` — and then the service takes over and stays the
      source of truth. Keep it that way: logic duplicated here is logic that
      will disagree with the service on some future branch.

      That is not hypothetical — it already did, in the first draft of this
      block. It enumerated the values it trusted (`'system'` or empty) and so
      sent everything ELSE to light, while `detectInitialPreference()` treats
      an unrecognised key as `system` and asks the OS. One corrupted
      localStorage entry and the pre-paint class and the service disagreed for
      the whole session. Phrased as "not light" instead, the two agree for
      every input, including the ones nobody thought of.

      Wrapped in try/catch because localStorage throws outright in Safari
      private mode, and a theme is not worth a blank page.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('budojoTheme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {
          /* no theme is better than no app */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
