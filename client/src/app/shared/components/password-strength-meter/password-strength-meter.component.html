@if (score() !== null) {
  <div
    class="password-meter"
    [attr.data-cy]="'password-strength-meter'"
    [attr.data-score]="score()"
  >
    <div
      class="password-meter__bar"
      role="progressbar"
      [attr.aria-valuenow]="score()"
      aria-valuemin="0"
      aria-valuemax="4"
      [attr.aria-valuetext]="labelKey() | translate"
    >
      <div class="password-meter__bar-fill" [ngClass]="variantClass()"></div>
    </div>
    <small class="password-meter__label">{{ labelKey() | translate }}</small>
  </div>
}
