<a class="rail__brand" [routerLink]="brand().routerLink" data-cy="rail-brand">
  @if (brand().logoUrl; as url) {
    <img [src]="url" alt="" class="rail__logo" aria-hidden="true" />
  } @else {
    <!-- Inline so stroke="currentColor" inherits the rail text color (#99). -->
    <app-brand-glyph class="rail__logo" data-cy="brand-glyph-fallback" />
  }
  <span class="rail__brand-text">{{ brand().label }}</span>
</a>

<button type="button" class="rail__create" (click)="createActivated.emit()" data-cy="rail-create">
  <i class="pi pi-plus" aria-hidden="true"></i>
  <span>{{ createLabel() }}</span>
</button>

<nav class="rail__nav">
  @for (tab of tabs(); track tab.routerLink) {
    <a
      class="rail__item"
      [routerLink]="tab.routerLink"
      routerLinkActive="rail__item--active"
      #rla="routerLinkActive"
      [attr.aria-current]="rla.isActive ? 'page' : null"
    >
      <i [class]="tab.icon" aria-hidden="true"></i>
      <span class="rail__label">{{ tab.label }}</span>
    </a>
  }
</nav>

@if (profile(); as p) {
  <a class="rail__profile" [routerLink]="p.routerLink" data-cy="rail-profile">
    <app-user-avatar [name]="p.name" [url]="p.avatarUrl" />
    <span class="rail__profile-meta">
      <span class="rail__profile-name">{{ p.name }}</span>
      @if (p.handle) {
        <span class="rail__profile-handle">&#64;{{ p.handle }}</span>
      }
    </span>
  </a>
}
