<div class="layout">
  <!-- Mobile topbar (<768px): brand + avatar. The hamburger off-canvas
       drawer is retired (#1109) — the bottom tab bar is the primary nav. -->
  <header class="topbar" role="banner">
    <a
      routerLink="/dashboard/me/feed"
      class="topbar__title"
      [attr.aria-label]="'nav.homeAriaLabel' | translate"
      data-cy="topbar-home-link"
    >
      <app-brand-glyph class="topbar__logo" />
      Budojo
    </a>
    @if (user(); as topbarUser) {
      <app-user-avatar [name]="topbarUser.full_name" [url]="topbarUser.avatar_url" />
    }
  </header>

  <!-- Desktop social rail (>=768px) — the Instagram/X left-rail pattern
       (#1110). Same IA as the mobile bottom tab bar (the shared `tabs()`),
       a prominent ➕ create, and the profile pinned at the bottom; the dense
       SaaS sidebar is retired. Hidden on mobile, where the bottom nav owns
       navigation. -->
  <aside class="rail" role="navigation" [attr.aria-label]="navAriaLabel()" data-cy="athlete-rail">
    <a
      routerLink="/dashboard/me/feed"
      class="rail__brand"
      [attr.aria-label]="'nav.homeAriaLabel' | translate"
    >
      <app-brand-glyph class="rail__logo" />
      <span class="rail__brand-text">Budojo</span>
    </a>

    <button type="button" class="rail__create" (click)="onCreate()" data-cy="rail-create">
      <i class="pi pi-plus" aria-hidden="true"></i>
      <span>{{ createTitle() }}</span>
    </button>

    <nav class="rail__nav">
      @for (tab of tabs(); track tab.routerLink) {
        <a
          class="rail__item"
          [routerLink]="tab.routerLink"
          routerLinkActive="rail__item--active"
          #rla="routerLinkActive"
          [attr.aria-current]="rla.isActive ? 'page' : null"
        >
          <i [class]="tab.icon" aria-hidden="true"></i>
          <span class="rail__label">{{ tab.label }}</span>
        </a>
      }
    </nav>

    @if (user(); as railUser) {
      <a routerLink="/dashboard/me/more" class="rail__profile" data-cy="rail-profile">
        <app-user-avatar [name]="railUser.full_name" [url]="railUser.avatar_url" />
        <span class="rail__profile-meta">
          <span class="rail__profile-name">{{ railUser.first_name }} {{ railUser.last_name }}</span>
          @if (railUser.handle) {
            <span class="rail__profile-handle">&#64;{{ railUser.handle }}</span>
          }
        </span>
      </a>
    }
  </aside>

  <main class="main">
    <router-outlet />
  </main>

  <!-- Mobile bottom tab bar (<768px) + the role's ➕ create sheet (#1109). -->
  <app-bottom-nav
    class="mobile-nav"
    [tabs]="tabs()"
    [centerAction]="centerAction()"
    [ariaLabel]="navAriaLabel()"
    (centerActivated)="onCreate()"
  />
  <app-create-sheet [actions]="createActions()" [heading]="createTitle()" />
</div>
