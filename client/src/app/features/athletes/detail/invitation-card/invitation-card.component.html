<app-card dataCy="athlete-invitation-card">
  <span header class="invitation-card__eyebrow">{{ 'athletes.invitation.title' | translate }}</span>

  <div body>
    @if (!hasEmail()) {
      <p class="invitation-card__hint" data-cy="athlete-invitation-no-email">
        {{ 'athletes.invitation.noEmail' | translate }}
      </p>
    } @else if (invitation(); as inv) {
      @if (inv.state === 'pending') {
        <div class="invitation-card__row" data-cy="athlete-invitation-pending">
          <p-tag
            severity="info"
            [rounded]="true"
            [value]="'athletes.invitation.pendingChip' | translate: pendingChipParams() ?? {}"
            data-cy="athlete-invitation-pending-chip"
          />
          <div class="invitation-card__actions">
            <p-button
              [label]="'athletes.invitation.resend' | translate"
              icon="pi pi-send"
              severity="secondary"
              [outlined]="true"
              size="small"
              [loading]="resending()"
              [disabled]="resending() || revoking()"
              (onClick)="resend()"
              data-cy="athlete-invitation-resend"
            />
            <app-confirm-destructive-button
              [label]="'athletes.invitation.revoke' | translate"
              [ariaLabel]="'athletes.invitation.revoke' | translate"
              [confirmMessage]="'athletes.invitation.confirm.revokeMessage' | translate"
              [acceptLabel]="'athletes.invitation.confirm.revokeAccept' | translate"
              [rejectLabel]="'athletes.invitation.confirm.revokeReject' | translate"
              [loading]="revoking()"
              [disabled]="resending() || revoking()"
              (confirmed)="revoke()"
              dataCy="athlete-invitation-revoke"
            />
          </div>
        </div>
      } @else {
        <div class="invitation-card__row" data-cy="athlete-invitation-accepted">
          <p-tag
            severity="success"
            [rounded]="true"
            icon="pi pi-check"
            [value]="'athletes.invitation.acceptedChip' | translate: acceptedChipParams() ?? {}"
            data-cy="athlete-invitation-accepted-chip"
          />
        </div>
      }
    } @else {
      <p class="invitation-card__hint">
        {{ 'athletes.invitation.emptyHint' | translate }}
      </p>
      <p-button
        [label]="'athletes.invitation.invite' | translate"
        icon="pi pi-user-plus"
        severity="secondary"
        [outlined]="true"
        size="small"
        [loading]="sending()"
        (onClick)="invite()"
        data-cy="athlete-invitation-invite"
      />
    }
  </div>
</app-card>

<!-- Confirm surface lives on the host: app-card projects only the three
     named slots, so an unslotted <p-confirmpopup> nested inside would be
     dropped. The popup anchors to the revoke button via its event target
     regardless of DOM position. -->
<p-confirmpopup />
