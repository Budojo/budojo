<div class="heatmap" data-cy="attendance-heatmap">
  <svg
    class="heatmap__svg"
    [attr.viewBox]="'0 0 ' + (grid().length * 13 + 30) + ' 110'"
    [style.maxWidth.px]="grid().length * 22 + 30"
    preserveAspectRatio="xMinYMin meet"
    role="img"
    [attr.aria-label]="'stats.attendance.heatmap.ariaLabel' | translate"
    [attr.aria-describedby]="scaleLabel() ? 'attendance-heatmap-scale' : null"
  >
    <!-- Day-of-week labels on the left -->
    <g>
      <text x="0" y="32" class="heatmap__dow">
        {{ 'stats.attendance.heatmap.dow.mon' | translate }}
      </text>
      <text x="0" y="60" class="heatmap__dow">
        {{ 'stats.attendance.heatmap.dow.wed' | translate }}
      </text>
      <text x="0" y="88" class="heatmap__dow">
        {{ 'stats.attendance.heatmap.dow.fri' | translate }}
      </text>
    </g>

    <!-- Month labels above the columns -->
    <g transform="translate(30, 0)">
      @for (m of monthLabels(); track m.col) {
        <text [attr.x]="m.col * 13" y="10" class="heatmap__month">{{ m.label }}</text>
      }
    </g>

    <!--
      Cells. One explicit class binding per shade rather than a class name
      built by concatenation: `make dead-styles` cannot see a name it never
      reads whole, and the five `--bN` rules sat in its report as unworn while
      being worn on every cell.
    -->
    <g transform="translate(30, 16)">
      @for (week of grid(); let colIdx = $index; track colIdx) {
        @for (cell of week; let rowIdx = $index; track rowIdx) {
          <rect
            [attr.x]="colIdx * 13"
            [attr.y]="rowIdx * 13"
            width="11"
            height="11"
            rx="2"
            class="heatmap__cell"
            [class.heatmap__cell--b0]="cell.bucket === 0"
            [class.heatmap__cell--b1]="cell.bucket === 1"
            [class.heatmap__cell--b2]="cell.bucket === 2"
            [class.heatmap__cell--b3]="cell.bucket === 3"
            [class.heatmap__cell--b4]="cell.bucket === 4"
            [class.heatmap__cell--out]="!cell.inWindow"
          >
            <title>{{ cell.tooltip }}</title>
          </rect>
        }
      }
    </g>
  </svg>

  <!--
    The key. The ramp, and under it what the ramp means in this window
    (#1560): the shades are quartiles of the days shown, so "more" is a
    different number on every academy and every range, and a legend that
    only said less → more would be explaining a scale it does not show.
  -->
  <div class="heatmap__key">
    <!-- The swatch row is decorative; the caption under it is the one place
         the scale is said in words, so it stays exposed and the SVG points
         at it. -->
    <div class="heatmap__legend" aria-hidden="true">
      <span>{{ 'stats.attendance.heatmap.less' | translate }}</span>
      <span class="heatmap__legend-cell heatmap__legend-cell--b0"></span>
      <span class="heatmap__legend-cell heatmap__legend-cell--b1"></span>
      <span class="heatmap__legend-cell heatmap__legend-cell--b2"></span>
      <span class="heatmap__legend-cell heatmap__legend-cell--b3"></span>
      <span class="heatmap__legend-cell heatmap__legend-cell--b4"></span>
      <span>{{ 'stats.attendance.heatmap.more' | translate }}</span>
    </div>
    @if (scaleLabel(); as scale) {
      <p id="attendance-heatmap-scale" class="heatmap__scale" data-cy="attendance-heatmap-scale">
        {{ scale }}
      </p>
    }
  </div>
</div>
