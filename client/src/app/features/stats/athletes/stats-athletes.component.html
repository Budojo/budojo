<section class="stats-athletes" data-cy="stats-athletes">
  <header class="stats-athletes__header">
    <h2 class="stats-athletes__title">{{ 'stats.athletes.ageBandsTitle' | translate }}</h2>
    <p class="stats-athletes__hint">{{ 'stats.athletes.ageBandsHint' | translate }}</p>
  </header>

  @if (errored()) {
    <app-error-state
      [title]="'stats.athletes.errored' | translate"
      [headingLevel]="3"
      dataCy="stats-athletes-error"
    />
  } @else if (loading()) {
    <p-skeleton
      height="20rem"
      data-cy="stats-athletes-loading"
      [attr.aria-label]="'stats.athletes.loading' | translate"
    />
  } @else if (isEmpty()) {
    <app-empty-state
      icon="pi pi-users"
      [title]="'stats.athletes.empty' | translate"
      [headingLevel]="3"
      dataCy="stats-athletes-empty"
    />
  } @else {
    <div class="stats-athletes__toolbar">
      <p-selectbutton
        [options]="scopeOptions()"
        optionLabel="label"
        optionValue="value"
        [ngModel]="scope()"
        (ngModelChange)="scope.set($event)"
        data-cy="stats-athletes-scope"
      />
    </div>

    <div class="stats-athletes__chart" data-cy="stats-athletes-chart">
      <p-chart type="bar" [data]="chartData()" [options]="chartOptions" />
    </div>

    @if (payload().missing_dob > 0) {
      <p class="stats-athletes__missing" data-cy="stats-athletes-missing">
        {{ 'stats.athletes.missingDob' | translate: { count: payload().missing_dob } }}
      </p>
    }
  }
</section>
