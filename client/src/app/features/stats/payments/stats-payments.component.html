<section class="stats-payments" data-cy="stats-payments">
  <header class="stats-payments__header">
    <div class="stats-payments__heading">
      <h2 class="stats-payments__title">{{ 'stats.payments.monthlyTitle' | translate }}</h2>
      <p class="stats-payments__hint">{{ 'stats.payments.monthlyHint' | translate }}</p>
    </div>
    <!-- The accountant's file (#1762): one button, and the season in a menu —
         the current one, and the one before, which in September is the
         finished season the accountant is asking for. -->
    @if (exportSeasons().length > 0) {
      <!-- A native button, so `aria-haspopup` sits on the element a screen
           reader announces; `p-button` would put it on its host. -->
      <button
        pButton
        type="button"
        severity="secondary"
        aria-haspopup="menu"
        [disabled]="exporting()"
        (click)="openSeasonMenu($event)"
        data-cy="stats-payments-export"
      >
        <i
          [class]="exporting() ? 'pi pi-spin pi-spinner' : 'pi pi-download'"
          pButtonIcon
          aria-hidden="true"
        ></i>
        <span pButtonLabel>{{
          (exporting() ? 'stats.payments.export.inProgress' : 'stats.payments.export.button')
            | translate
        }}</span>
      </button>
      <p-menu #seasonMenu [popup]="true" [model]="seasonItems()" appendTo="body" />
    }
  </header>

  @if (errored()) {
    <app-error-state
      [title]="'stats.payments.errored' | translate"
      [headingLevel]="3"
      dataCy="stats-payments-error"
    />
  } @else if (loading()) {
    <p-skeleton
      height="20rem"
      data-cy="stats-payments-loading"
      [attr.aria-label]="'stats.payments.loading' | translate"
    />
  } @else if (isEmpty()) {
    <app-empty-state
      icon="pi pi-wallet"
      [title]="'stats.payments.empty' | translate"
      [headingLevel]="3"
      dataCy="stats-payments-empty"
    />
  } @else {
    <div class="stats-payments__chart-wrap" data-cy="stats-payments-chart">
      <p-chart type="bar" [data]="chartData()" [options]="chartOptions()" height="100%" />
    </div>
  }

  <!-- Outside the chart's states: an academy with nothing collected this year
       is exactly the one whose arrears matter. -->
  <app-payments-arrears />
</section>
