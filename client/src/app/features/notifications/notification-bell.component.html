<button
  type="button"
  class="notification-bell"
  [attr.aria-label]="'notifications.bell.ariaLabel' | translate"
  [pTooltip]="'notifications.bell.tooltip' | translate"
  tooltipPosition="bottom"
  (click)="open()"
  data-cy="notification-bell"
>
  <i class="pi pi-bell" aria-hidden="true"></i>
  @if (hasUnread()) {
    <span
      class="notification-bell__badge"
      [attr.aria-label]="'notifications.bell.unreadCount' | translate: { count: unread() }"
      data-cy="notification-bell-badge"
    >
      {{ unread() > 99 ? '99+' : unread() }}
    </span>
  }
</button>
