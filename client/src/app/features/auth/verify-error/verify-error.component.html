<app-verify-page
  state="warning"
  iconClass="pi pi-times-circle"
  titleKey="auth.verifyError.title"
  [messageKey]="
    canResend ? 'auth.verifyError.messageCanResend' : 'auth.verifyError.messageCannotResend'
  "
>
  @if (canResend) {
    <p-button
      type="button"
      severity="primary"
      [label]="'auth.verifyError.resendCta' | translate"
      (onClick)="resend()"
      data-cy="verify-error-resend"
    />
  } @else {
    <p-button
      type="button"
      severity="primary"
      [label]="'auth.verifyError.signinCta' | translate"
      (onClick)="goToLogin()"
      data-cy="verify-error-login"
    />
  }
</app-verify-page>
