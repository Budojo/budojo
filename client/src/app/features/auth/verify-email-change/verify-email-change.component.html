<app-verify-page
  [state]="state()"
  [iconClass]="iconClass()"
  [titleKey]="titleKey()"
  [titleDataCy]="titleDataCy()"
  [messageKey]="messageKey()"
  [hintKey]="hintKey()"
  [hintDataCy]="hintDataCy()"
>
  @if (state() === 'error') {
    @if (errorBackTarget() === '/dashboard/profile') {
      <p-button
        type="button"
        severity="secondary"
        [text]="true"
        [label]="'account.emailChange.verify.errorRequestNewProfile' | translate"
        [routerLink]="errorBackTarget()"
        data-cy="verify-email-change-cta-profile"
      />
    } @else {
      <p-button
        type="button"
        severity="secondary"
        [text]="true"
        [label]="'account.emailChange.verify.errorRequestNewLogin' | translate"
        [routerLink]="errorBackTarget()"
        data-cy="verify-email-change-cta-login"
      />
    }
  }
</app-verify-page>
