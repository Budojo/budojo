# Local development environment.
#
# Runtime parity note: the shipped desktop app (M11) runs on SQLite, so dev
# runs on SQLite too. A MySQL-backed dev environment would let grammar
# differences (JSON path syntax, LIKE case-sensitivity, strict-mode casting)
# hide until packaging time.
#
# This file is DEVELOPMENT ONLY. There is no production compose file any more
# — see docs/desktop/ for how the desktop app boots its own PHP runtime.

services:

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: budojo_api
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./server:/var/www/api
      # The SQLite database lives on a named volume, NOT on the bind mount
      # above. Docker Desktop's host filesystem share (9p / virtiofs) does not
      # implement POSIX advisory locking faithfully, and SQLite relies on it
      # for WAL coordination — the failure mode is a silently corrupt database
      # rather than an error. A named volume is backed by the VM's own ext4,
      # where locking behaves. Inspect it with:
      #   docker exec -it budojo_api sqlite3 /var/www/api/database/sqlite/budojo.sqlite
      - sqlite_data:/var/www/api/database/sqlite
    # NOTE: deliberately NO `env_file`. Compose injects an env_file into the
    # container as real environment variables, and Laravel resolves env() from
    # $_SERVER before $_ENV — so every blank key in a root .env silently
    # overrode both server/.env AND the <env> values in phpunit.xml. That is
    # how a blank VAPID_PUBLIC_KEY turned 13 push tests into 503s, and how
    # DB_DATABASE pointed RefreshDatabase at the development database.
    # phpunit force="true" does NOT fix it: PHPUnit sets putenv() and $_ENV,
    # never $_SERVER. The app is configured by server/.env, full stop — which
    # is also exactly what CI does (pr-checks.yml runs PEST in server/).
    environment:
      RUN_MIGRATIONS: "1"
    networks:
      - budojo_network

  client:
    build:
      context: ./client
      dockerfile: ../docker/client/Dockerfile
    container_name: budojo_client
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - budojo_network
    depends_on:
      - api

  # Catches every outbound mail so the 9 Mailables can be exercised without
  # a Resend key and without any risk of reaching a real inbox.
  mailpit:
    image: axllent/mailpit:latest
    container_name: budojo_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - budojo_network

networks:
  budojo_network:
    driver: bridge

volumes:
  sqlite_data:
